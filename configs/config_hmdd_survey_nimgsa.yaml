# =============================================================================
# Thin config for the HMDD topology-baseline audit: NIMGSA (2022), miRNA-disease
# link prediction. Tier 2 -- NIMGSA's own m-d.txt association matrix is confirmed
# byte-identical to MGCNSS's (see download_hmdd_survey_canonical5430.py), but
# NIMGSA's fivefoldcv.py builds folds at runtime with no bundled split file, so a
# split is generated here: single random 90/10 held-out slice (not full 5-fold --
# a light audit, not a full replication) at NIMGSA's own stated negative ratio.
# NIMGSA's paper does not describe its negative-sampling method at all
# (literature_survey.tsv: "not described") -- 1:1 uniform is used here as the
# clearly-labeled field-default approximation, not a claim about what NIMGSA did.
# Consumed by training/eval_hmdd_survey_topology_baseline.py.
# =============================================================================

project:
  name: nimgsa
  seed: 42

data:
  matrix_path: data/raw/hmdd_survey/nimgsa/matrix.csv
  test_fraction: 0.1
  negative_ratio: 1

evaluation:
  paper_reference:
    tier: 2
    headline_auroc: 0.9354
    negative_sampling: "not described"
    url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC8774034/"
    caveat: >
      NIMGSA's paper does not state its negative-sampling method or exact split;
      this run uses a single random 90/10 edge split with 1:1 uniform negatives
      (the field default) as an honest approximation, not a reproduction of
      NIMGSA's own (undocumented) protocol.

slurm:
  partition: dgx_large
  nodelist: dgxa100jal
  cpus_per_task: 4
  mem: 8gb
  conda_env: mirna_ms
  conda_init: /shared/apps/Python/Tensorflow/3.11.6/etc/profile.d/conda.sh
