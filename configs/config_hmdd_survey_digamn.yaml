# =============================================================================
# Thin config for the HMDD topology-baseline audit: DiGAMN (Liu et al., BMC
# Genomics 2024), miRNA-disease link prediction. Tier 2 -- exact "Data1" matrix
# (917x792, 14,550 positives -- confirmed against the paper's own Table 1, NOT
# the repo code's own default run target "AMHMDA"; see
# data/01_download/download_hmdd_survey_digamn.py for the full trace), no
# bundled split, so a split is generated here at their stated 1:1 ratio (the
# ratio behind their 96.35% headline number).
# Consumed by training/eval_hmdd_survey_topology_baseline.py.
# =============================================================================

project:
  name: digamn
  seed: 42

data:
  matrix_path: data/raw/hmdd_survey/digamn/matrix.csv
  test_fraction: 0.1
  negative_ratio: 1

evaluation:
  paper_reference:
    tier: 2
    headline_auroc: 0.9635
    negative_sampling: "uniform random, 1:1 (balanced) -- 1:5 and 1:10 also tested, not reproduced here"
    url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC11610307/"
    caveat: >
      96.35% is DiGAMN's own reported number on "Data1" (1:1 balanced negatives).
      No split file is bundled; this run uses a single random 90/10 edge split
      with 1:1 uniform negatives as an honest approximation, not a reproduction
      of DiGAMN's own exact split.

slurm:
  partition: dgx_large
  nodelist: dgxa100jal
  cpus_per_task: 4
  mem: 8gb
  conda_env: mirna_ms
  conda_init: /shared/apps/Python/Tensorflow/3.11.6/etc/profile.d/conda.sh
