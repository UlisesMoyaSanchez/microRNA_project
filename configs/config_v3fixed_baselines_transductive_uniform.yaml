# =============================================================================
# Cross-architecture protocol check, cell 4 of 4 — seen edges (leak on purpose), uniform negatives — the ORIGINAL protocol
#
# Consumed by training/run_baselines.py, NOT training/slurm_train.sh. Each of the four
# configs selects one cell of the protocol x negative-sampler grid; run_baselines.py
# trains every architecture (hgt_v2, random, mlp, homo_gcn, ablation_no_mirna,
# ablation_no_coexpr) under that cell and scores each under BOTH samplers.
#
# Why: goal.md 3.2 — the audit so far shows only that *our* HGT was evaluated badly,
# which is what a reviewer will say. If the inflation appears for every architecture,
# the finding is about the protocol rather than about one model.
#
# Cloned verbatim from config_v3fixed_edgesplit.yaml. The ONLY deltas are project.name,
# training.edge_split, training.hard_negatives and training.checkpoint_dir — architecture,
# optimizer, graph routing and split ratios are identical, or the comparison across cells
# would confound protocol with hyperparameters.
#
# evaluation.reference_seen_edges is deliberately absent: it is read by
# eval_heldout_grid.py, which hardcodes miRNAGraphTransformer and cannot score the MLP or
# GCN baselines. The transductive rows here are measured directly by the two
# edge_split: false cells instead of being cited from a constant.
#
# Single seed (project.seed 42) BY DESIGN, n=1 — the inflation is ~0.35 while the seed
# spread measured everywhere it could be replicated is 0.005-0.02. Report these as n=1;
# do not attach an error bar they do not carry.
# =============================================================================

project:
  name: mirna_ms_v3fixed_baselines_transductive_uniform
  seed: 42
  output_dir: /raid/home/umoya/scripts/microRNA_project/results

data:
  raw_dir:       /raid/home/umoya/scripts/microRNA_project/data/raw
  processed_dir: /raid/home/umoya/scripts/microRNA_project/data/processed
  graphs_dir:    /raid/home/umoya/scripts/microRNA_project/data/graphs_v3fixed

  cellxgene:
    organism: "Homo sapiens"
    disease:  "multiple sclerosis"
    tissue:
      - "blood"
      - "brain"
      - "cerebrospinal fluid"
    n_top_genes: 3000
    min_cells:   3
    min_genes:   200
    max_pct_mito: 20.0
    max_obs_ms:   150000
    max_obs_ctrl: 100000

  mirna:
    mirdb_url: "https://mirdb.org/download/miRDB_v6.0_prediction_result.txt.gz"
    mirdb_score_threshold: 80
    min_interactions: 5

  geo:
    accessions:
      GSE289530: "miRNA microarray (GPL19117); lymphocytes, monocytes, neutrophils; mixed cohort per Sample_description (Control/MS/T1D), 166 samples, 2026. NOTE: not used downstream (mirna_expr.tsv has zero readers)."

  graph:
    coexpression_threshold:          0.60
    coexpression_top_n_genes:        1000
    cell_gene_expression_threshold:  0.10
    min_mirna_gene_interactions:     2

cell_type_markers:
  T_cell:        ["CD3D", "CD3E", "CD3G"]
  CD4_T:         ["CD4", "IL7R"]
  CD8_T:         ["CD8A", "CD8B"]
  Th17:          ["IL17A", "RORC", "IL23R", "CCR6"]
  Treg:          ["FOXP3", "IL2RA", "CTLA4"]
  B_cell:        ["MS4A1", "CD19", "CD79A"]
  NK_cell:       ["GNLY", "NKG7", "NCAM1"]
  Monocyte:      ["CD14", "LYZ", "CST3"]
  Microglia:     ["CX3CR1", "P2RY12", "TMEM119", "SLC2A5"]
  Oligodendrocyte: ["MBP", "PLP1", "MOG", "CNP"]
  Astrocyte:     ["GFAP", "S100B", "AQP4", "ALDH1L1"]

model:
  hidden_channels: 512        # wider: 256→512
  num_heads:       8
  num_layers:      4          # deeper: 3→4
  dropout:         0.3        # more regularization: 0.2→0.3
  mirna_init_dim:  64

training:
  batch_size:   512
  num_epochs:   200
  lr:           5.0e-4        # slower: 1e-3→5e-4
  weight_decay: 1.0e-5
  patience:     25            # more patience for slower lr
  loss_reconstruction_weight: 1.0
  loss_classification_weight: 0.5
  loss_sparsity_weight:       0.01
  val_ratio:    0.10
  test_ratio:   0.10
  num_neighbors: [10, 5]

  # Edge-level split: val_ratio/test_ratio above also govern the miRNA→gene edge
  # holdout. disjoint_train_ratio further splits the training edges so the ones
  # used as supervision targets are not also fed to the encoder.
  disjoint_train_ratio: 0.3
  edge_split:     false         # TRANSDUCTIVE: no holdout, the leak on purpose
  hard_negatives: false         # uniform negatives

  checkpoint_dir: /raid/home/umoya/scripts/microRNA_project/checkpoints_v3fixed_baselines_transductive_uniform
  log_dir:        /raid/home/umoya/scripts/microRNA_project/logs

slurm:
  partition:    dgx_large
  nodelist:     dgxa100jal
  gpus_train:   4
  cpus_per_task: 16
  mem:          128gb
  conda_env:    mirna_ms
  conda_init:   /shared/apps/Python/Tensorflow/3.11.6/etc/profile.d/conda.sh

